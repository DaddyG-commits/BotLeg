        '  var rh = parent.getBoundingClientRect().height;\n' +
        '  if (!(rw > 10)) rw = parent.clientWidth || parent.offsetWidth || 360;\n' +
        '  if (!(rh > 10)) rh = parent.clientHeight || parent.offsetHeight || 260;\n' +
        '  var dpr = devicePixelRatio || 1;\n' +
        '  canvas.width = rw * dpr; canvas.height = rh * dpr;\n' +
        '  canvas.style.width = rw + "px"; canvas.style.height = rh + "px";\n' +
        '  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); W = rw; H = rh;\n' +

    function forceChartReady() {
      try {
        if (typeof resize === 'function') resize();
        if (typeof drawChart === 'function') drawChart();
      } catch (e) {}
    }

    Promise.all([
      fetch(base + 'index.html').then(function (r) {
        if (!r.ok) throw new Error('HTML ' + r.status);
        return r.text();
      }),
      fetch(base + 'app.js').then(function (r) {
        if (!r.ok) throw new Error('JS ' + r.status);
        return r.text();
      })
    ])
      .then(function (pair) {
        var html = patchHtml(brand(pair[0]));
        var js = patchJs(brand(pair[1]));
        html = html.replace(/<script\s+src=["']app\.js["']\s*><\/script>/gi, '');

        document.open();
        document.write(html);
        document.close();

        var s = document.createElement('script');
        s.text = js;
        document.body.appendChild(s);

        forceChartReady();
        requestAnimationFrame(function () {
          forceChartReady();
          setTimeout(forceChartReady, 50);
          setTimeout(forceChartReady, 200);
          setTimeout(forceChartReady, 600);
        });
        window.addEventListener('resize', forceChartReady);
      })
      .catch(function (e) {
        document.getElementById('boot').innerHTML =
          'Failed to load BotLeg.<br><small style="color:#666">' +
          (e && e.message ? e.message : e) +
          '</small>';
        console.error(e);
      });
  })();
  </script>
</body>
</html>
